name: Python Lint + AutoFix + AutoCommit

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: autoformat-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install black pylint flask flask-cors flask-sqlalchemy flask-jwt-extended python-dotenv bcrypt
      - run: black .
      - run: pylint $(git ls-files '*.py') || true
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-format: Python corrections" || echo "Aucun changement à commit"
          git push origin HEAD:main
