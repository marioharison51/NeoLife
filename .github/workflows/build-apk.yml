name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate missing Flutter scaffolding if needed
        working-directory: flutter_app
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name neolife --org com.mariohariso51 .
          fi

      - name: Allow cleartext HTTP traffic (localhost backend)
        working-directory: flutter_app
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">127.0.0.1</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
              </domain-config>
          </network-security-config>
          EOF
          sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neolife-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
